# WinSetup — перенос окружения Windows 10
# Не помещайте сюда пароли, токены и ключи.
appx_removal = [
    "Microsoft.549981C3F5F10",
    "Microsoft.SkypeApp",
    "Microsoft.Wallet",
    "Microsoft.MixedReality.Portal",
    "Microsoft.Microsoft3DViewer",
    "Microsoft.MSPaint",
    "Microsoft.People",
    "Microsoft.GetHelp",
    "Microsoft.Getstarted",
    "Microsoft.WindowsFeedbackHub",
    "Microsoft.WindowsMaps",
    "Microsoft.MicrosoftSolitaireCollection",
    "Clipchamp.Clipchamp",
    "Microsoft.BingWeather",
    "Microsoft.BingSearch",
    "Microsoft.MicrosoftOfficeHub",
    "Microsoft.Office.OneNote",
    "Microsoft.YourPhone",
    "MicrosoftWindows.CrossDevice",
    "Microsoft.ZuneVideo",
    "Microsoft.Windows.DevHome",
    "Microsoft.XboxApp",
    "Microsoft.OutlookForWindows",
    "microsoft.windowscommunicationsapps",
    "Microsoft.MicrosoftStickyNotes",
    "Microsoft.XboxGamingOverlay",
    "Microsoft.Windows.Photos",
    "Microsoft.WindowsSoundRecorder",
    "Microsoft.WindowsCamera",
    "Microsoft.WindowsAlarms",
    "Microsoft.ZuneMusic",
]
autostart = []
repositories = []

# Версия формата
[meta]
schema_version = 1

# Интерфейс и выбранный диск данных; секреты запрещены
[application]
# Раздел безопасных диагностических тестов (по умолчанию выключен)
dev_mode = false
mode = "choose"
theme = "dark"
selected_profile = "Мой ПК"
data_drive = ""
ui_accent = "blue"
ui_scale = 100
ui_density = "normal"
ui_animations = true
ui_anim_speed = "normal"
ui_reduce_motion = false
ui_start_mode = "choose"
ui_confirm_close = true
ui_notify_done = true

# Независимые профили: списки выбранных действий
[[profiles]]
name = "Мой ПК"
programs = [
    "steam",
    "discord",
    "vencord",
    "firefox",
    "nvidia",
    "claude",
    "telegram",
    "git",
    "armoury",
]
paths = [
    "steam",
    "main",
    "secondary",
]
appx_removal = [
    "Microsoft.549981C3F5F10",
    "Microsoft.SkypeApp",
    "Microsoft.Wallet",
    "Microsoft.MixedReality.Portal",
    "Microsoft.Microsoft3DViewer",
    "Microsoft.MSPaint",
    "Microsoft.People",
    "Microsoft.GetHelp",
    "Microsoft.Getstarted",
    "Microsoft.WindowsFeedbackHub",
    "Microsoft.WindowsMaps",
    "Microsoft.MicrosoftSolitaireCollection",
    "Clipchamp.Clipchamp",
    "Microsoft.BingWeather",
    "Microsoft.BingSearch",
    "Microsoft.MicrosoftOfficeHub",
    "Microsoft.Office.OneNote",
    "Microsoft.YourPhone",
    "MicrosoftWindows.CrossDevice",
    "Microsoft.ZuneVideo",
    "Microsoft.Windows.DevHome",
    "Microsoft.XboxApp",
]
autostart = []
repositories = []
restore_backup = false

[profiles.windows_tweaks]
max_refresh = "enabled"
notify_discord = "disabled"
notify_snip = "disabled"
notify_telegram = "disabled"
suggestions = "disabled"

[[profiles]]
name = "Безопасный минимум"
programs = [
    "firefox",
    "git",
    "telegram",
]
paths = []
appx_removal = []
autostart = []
repositories = []
restore_backup = false

[profiles.windows_tweaks]

[[profiles]]
name = "Пустой"
programs = []
paths = []
appx_removal = []
autostart = []
repositories = []
restore_backup = false

[profiles.windows_tweaks]

