# Разрешённые изменения Windows; keep означает не менять
[[windows_tweaks]]
key = "max_refresh"
name = "Максимальная частота"
description = "Только частота, без изменения разрешения, HDR и масштаба"
risk = "Осторожно"

[[windows_tweaks]]
key = "notify_snip"
name = "Уведомления снимков экрана"
description = "Разрешить или отключить уведомления приложения"
risk = "Безопасно"

[[windows_tweaks]]
key = "notify_discord"
name = "Уведомления Discord"
description = "Только Windows-уведомления"
risk = "Безопасно"

[[windows_tweaks]]
key = "notify_telegram"
name = "Уведомления Telegram"
description = "Только Windows-уведомления"
risk = "Безопасно"

[[windows_tweaks]]
key = "suggestions"
name = "Советы и предложения"
description = "Советы, реклама и персонализированные предложения Windows"
risk = "Безопасно"

# Пароль вводится только в интерфейсе
[backup]
firefox = true
sources = []
vault_path = ""

# Установщики выполняются последовательно
[execution]
retries = 2
minimum_free_gib = 5

# Защитные подтверждения обязательны
[safety]
restore_point = true
require_removal_confirmation = true

